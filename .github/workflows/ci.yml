name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test suite
        run: uv run pytest -v

  reproduce:
    name: containerised reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce the pipeline in the pinned container
        # The runner checks out as a different UID than the compose default, so
        # pass the real one through or the container cannot write its outputs.
        run: |
          HOST_UID=$(id -u) HOST_GID=$(id -g) \
            docker compose up --build --exit-code-from reproduce reproduce

      # Everything derived from the data, every baseline and both dense networks
      # must reproduce exactly. Conv2D dispatches on CPU SIMD features, so the CNN
      # is held to a tolerance instead — see scripts/compare_results.py.
      - name: Verify results match the committed golden copy
        run: |
          git show HEAD:reports/results.json > /tmp/golden.json
          python3 scripts/compare_results.py /tmp/golden.json reports/results.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
